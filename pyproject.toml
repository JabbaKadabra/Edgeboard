[project]
name = "xdash"
version = "0.1.0"
description = "Claude usage, Claude Code sessions, Spotify and system dashboard for a Corsair Xeneon Edge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
xdash = "xdash.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
