[project]
name = "edgeboard"
version = "0.1.0"
description = "Claude usage, Claude Code sessions, Spotify and system dashboard for a Corsair Xeneon Edge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# tests/test_page.py: renders the demo page in Chromium at the panel's 2560x720
browser = ["playwright>=1.45"]

[project.scripts]
edgeboard = "edgeboard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgeboard"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
# pyflakes, the pycodestyle errors that are real bugs, isort and bugbear
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]  # FastAPI's Field(...) defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright and Chromium (pip install -e '.[browser]' && playwright install chromium)"]
